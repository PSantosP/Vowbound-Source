+GameplayTagList=(Tag="Abilities.MoveTo",DevComment="")
+GameplayTagList=(Tag="AnimEffect",DevComment="애니 속 물리 순간 - UVBAnimNotify_ContextEffect 가 적고 UVBContextEffectComponent 표가 출력을 고른다(.sw/context-effects/design.md). Effect.* 는 게임플레이 이펙트 몫이라 따로 둔다")

[/Script/GameplayTags.GameplayTagsSettings]
; State.Combat.LowHealth -> State.Combat.FinisherWindow (2026-09-11).
; 왜 보험을 거는가: 옛 태그는 코드 참조가 0 이었지만 «자산 참조도 0» 은 그때 증명하지 못했다.
;   당시 대조군(State.Combat.Guarding)이 0 히트라 방법 자체를 못 믿었다.
;   2026-09-11 정정: 그 뒤 BT 에 State.Combat.FinisherWindow 를 저작하자 이진 grep 이 1 히트를 냈다.
;   즉 양성 대조군이 생겼고 방법은 작동한다 - 그 아래에서 State.Combat.LowHealth 는 여전히 0 이다.
;   그래도 리다이렉트는 남긴다. 지우는 것은 싸고, 남아 있던 참조가 무효 태그가 되는 것은 비싸다.
;   저작한 적 없는 태그를 지우는 것은 싸고, 어딘가 남아 있던 참조가 조용히 무효 태그가 되는 것은 비싸다.
;   그래서 부재를 증명하는 대신 틀려도 안전하게 만든다(규칙 27, 그리고 enum 개명 때의 +EnumRedirects 와 같은 판단).
+GameplayTagRedirects=(OldTagName="State.Combat.LowHealth",NewTagName="State.Combat.FinisherWindow")
; Data.Equip.* -> Data.Stat.* (2026-10-07, .sw/remaining-features/b2-growth.md 2절): 장비와 스킬 트리가 같은 능력치 효과를 쓴다 - 장비 전용 이름이 틀린 말이 됐다.
; 자산(GE·장비 DA·WBP_Inventory)을 새 이름으로 다시 저장한 뒤 지워도 되지만, 위와 같은 판단으로 남긴다.
+GameplayTagRedirects=(OldTagName="Data.Equip.MaxHealth",NewTagName="Data.Stat.MaxHealth")
+GameplayTagRedirects=(OldTagName="Data.Equip.MaxStamina",NewTagName="Data.Stat.MaxStamina")
+GameplayTagRedirects=(OldTagName="Data.Equip.AttackPower",NewTagName="Data.Stat.AttackPower")
+GameplayTagRedirects=(OldTagName="Data.Equip.DamageTakenScale",NewTagName="Data.Stat.DamageTakenScale")
+GameplayTagRedirects=(OldTagName="Data.Equip.ImpactResistance",NewTagName="Data.Stat.ImpactResistance")
+GameplayTagRedirects=(OldTagName="Data.Equip.MaxPoise",NewTagName="Data.Stat.MaxPoise")
+GameplayTagRedirects=(OldTagName="Data.Equip.MaxShield",NewTagName="Data.Stat.MaxShield")
+GameplayTagRedirects=(OldTagName="Data.Equip.KnockbackTakenScale",NewTagName="Data.Stat.KnockbackTakenScale")
; Skill.Node.Stamina.* -> Skill.Node.Guard.* (2026-10-08): 이 게임에는 스태미나가 없다(DEC-021 user 결정, 속성은 있으나 쓰는 곳 0). 옛 저장의 연 칸을 잃지 않게 둔다.
+GameplayTagRedirects=(OldTagName="Skill.Node.Stamina.Stamina1",NewTagName="Skill.Node.Guard.Firm")
+GameplayTagRedirects=(OldTagName="Skill.Node.Stamina.Poise",NewTagName="Skill.Node.Guard.Footing")
+GameplayTagRedirects=(OldTagName="Skill.Node.Stamina.Impact",NewTagName="Skill.Node.Guard.Steady")

; === GASP 5.8 이관분이 쓰는 태그 (2026-09-19, DEC-022) ===
;
; 왜 여기 있나: 자산 3,895개를 파일로 부어 넣으면서 GASP 쪽 태그 설정은 안 가져왔다.
;   그래서 그 자산들이 «등록 안 된 태그» 를 참조했고, StateTree 가 로드되며 컴파일될 때
;   FGameplayTag::MatchesTag 의 ensure 가 터져 user 에게 크래시 창이 떴다(2026-09-19 21:12·21:15).
;   로그 문구: "MatchesTag called on an invalid gameplay tag SmartObject.ObjectType.Player,
;   only registered tags can be used in containers". 같은 집안이 하나 더 있다 - 기동 로그에
;   다발로 뜨던 Foley.Event.* 경고도 이것이다.
;
; 왜 ini 인가(우리 태그는 C++ 네이티브인데): 이 태그들의 주인은 GASP 자산이지 우리 코드가 아니다.
;   우리가 코드에서 부르는 태그가 아니므로 VBGameplayTags 에 넣으면 «아무도 안 쓰는 네이티브 태그» 가 된다.
;   GASP 를 걷어내는 날 이 블록만 지우면 되도록 한 덩어리로 둔다.
; 출처: GASP 프로젝트의 DefaultGameplayTags.ini 전량(39개) 그대로.
; 주의(2026-10-01): 에디터가 태그를 더할 때 목록 전체를 이름순으로 다시 쓰므로, 우리 ini 태그도 이 목록 안에 섞여 들어온다.
;   GASP 몫은 루트 Abilities·Foley·GameplayCue·MotionMatching·SmartObject·StateTree·Statetree 뿐이다.
;   AnimEffect·Item·Speaker·Story 는 우리 것이다(애니 순간 이펙트·아이템·대화) - 블록을 지우는 날 이 넷은 남긴다.

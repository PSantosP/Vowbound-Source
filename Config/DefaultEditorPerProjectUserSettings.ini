[ContentBrowser]
; 같은 ThirdPerson 템플릿 잔재 — 존재하지 않는 폴더라 콘텐츠 브라우저가 빈 경로로 열렸다 (FIND-049)
ContentBrowserTab1.SelectedPaths=/Game/Vowbound
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; UE 5.8 공식 MCP 서버 (Engine/Plugins/Experimental/ModelContextProtocol, FriendlyName "Unreal MCP").
; ToolsetRegistry 의 공식 툴셋을 Streamable HTTP 로 외부 MCP 클라이언트에 노출한다 → http://127.0.0.1:8000/mcp
; 이 클래스는 config=EditorPerProjectUserSettings 라 DefaultEngine.ini 에 적으면 먹지 않는다(실측 확인).
; 포트 8000 은 우리 커스텀 브리지(45557 raw TCP)와 겹치지 않는다 — 전환기 동안 둘을 같이 띄워 비교한다.
bAutoStartServer=True
ServerPortNumber=8000
; True 면 list_toolsets/describe_toolset/call_tool 3개만 등록하고 나머지는 call_tool 로 디스패치한다.
; 830개 툴을 전부 등록하면 클라이언트 툴 목록이 폭발하므로 켠 채로 둔다.
bEnableToolSearch=True
